<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Estefano Poblete">
    <title>Pagina De Perfil (core)</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                Perfil
            </div>
            <div class="nav-links">
                <a href="#">Inicio</a>
                <a href="#">Mi perfil</a>
                <a href="#">Conexiones</a>
                <button>
                    Cerrar sesión
                </button>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="perfil">
            <div class="tarjeta">
                <div class="blue">
                    <img src="static/images/fotoperfil.jpg" alt="perfil">
                </div>
                <div class="blanco">
                    <div class="desc">
                        <h1>Jane Doe</h1>
                        <p class="loc">Bergen, Noruega</p>
                        <p>Desarrolladora Frontend.</p>
                        <p>Conocimiento en HTML, CSS y JavaScript</p>
                    </div>
                    <a href="#">⚙ Editar perfil</a>
                </div>
            </div>
        </section>
        <section class="conexiones">
            <div class="solicitudes">
                <div class="titulo">
                    <h1>Solicitudes de conexión</h1>
                    <button>Ver todas</button>
                </div>
                <div class="usuario">
                    <div class="infoUs">
                        <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                        <h1>Steve Jobs</h1>
                    </div>

                    <div class="botones">
                        <button class="aceptar">✓</button>
                        <button class="rechazar">X</button>
                    </div>
                </div>
                <div class="usuario">
                    <div class="infoUs">
                        <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                        <h1>Steve Jobs</h1>
                    </div>

                    <div class="botones">
                        <button class="aceptar">✓</button>
                        <button class="rechazar">X</button>
                    </div>

                </div>
            </div>
            <div class="amigos">
                <div class="titulo">
                    <h1>Tus conexiones</h1>
                    <button>Ver todas</button>
                </div>
                <div class="usuario">
                    <div class="infoUs">
                        <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                        <h1>Richard Stallman</h1>
                    </div>

                </div>
                <div class="usuario">
                    <div class="infoUs">
                        <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                        <h1>Linus Torvalds</h1>
                    </div>

                </div>
                <div class="usuario">
                    <div class="infoUs">
                        <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                        <h1>Ada Lovelace</h1>
                    </div>

                </div>
                <div class="usuario">
                    <div class="infoUs">
                        <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                        <h1>Grace Hopper</h1>
                    </div>

                </div>
            </div>
        </section>
    </main>
</body>

</html>
