<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Estefano Poblete">
    <title>Pagina De Perfil (core)</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                Perfil
            </div>
            <div class="nav-links">
                <a href="#">Inicio</a>
                <a href="#">Mi perfil</a>
                <a href="#">Conexiones</a>
                <button>
                    Cerrar sesión
                </button>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="tarjeta">
            <div class="blue">
            </div>
            <div class="info">
                <div class="imagen">
                    <img src="static/images/fotoperfil.jpg" alt="fotoPerfil" class="fotoPerfil">
                </div>
                <div class="desc">
                    <h1>Jane Doe</h1>
                    <p>Bergen, Noruega</p>
                    <div class="desc">
                        <div>Desarrolladora Frontend.</div>
                        <div>Conocimientos en HTML, CSS, JavaScript</div>
                    </div>
                </div>
                <div class="links">
                    <a href="#">⚙ Editar perfil</a>
            </div>
        </section>
        <section class="conexiones">
            <div class="solicitudes">
                <div>
                    <h1>Solicitudes de conexión</h1>
                    <button>Ver todas</button>
                </div>
                <div class="usuario">
                    <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                    <h1>Steve Jobs</h1>
                    <button class="aceptar">X</button>
                    <button class="rechazar">✓</button>
                </div>
                <div class="usuario">
                    <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                    <h1>Bill Gates</h1>
                    <button class="aceptar">X</button>
                    <button class="rechazar">✓</button>
                </div>
            </div>
            <div class="amigos">
                <h1>Tus conexiones</h1>
                <button>Ver todas</button>
            </div>
            <div class="usuario">
                <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                <h1>Richard Stallman</h1>
            </div>
            <div class="usuario">
                <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                <h1>Linus Torvalds</h1>
            </div>
            <div class="usuario">
                <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                <h1>Ada Lovelace</h1>
            </div>
            <div class="usuario">
                <img src="static/images/fotoperfil.jpg" alt="" class="fotoUsuario">
                <h1>Grace Hopper</h1>
            </div>
            </div>
        </section>
    </main>
</body>

</html>
